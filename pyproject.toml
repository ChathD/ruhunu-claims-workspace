[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-claims-agent"
version = "0.2.0"
description = "Standalone synthetic motor claims workspace with LangGraph and React"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13.4,<3"]

[project.optional-dependencies]
workspace = [
    "python-dotenv>=1.0,<2",
    "pypdf>=6,<7",
    "sentence-transformers>=5,<6",
    "python-multipart>=0.0.20,<1",
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.9",
    "langchain==1.5.0",
    "langgraph==1.2.22",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langfuse==5.2.0",
    "httpx==0.28.1",
]

[project.scripts]
claims-workspace = "backend.__main__:main"

[tool.setuptools.packages.find]
include = ["backend*"]
