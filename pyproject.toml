[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-claims-agent"
version = "0.2.0"
description = "Standalone synthetic motor claims workspace with LangGraph and React"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4,<3",
    "vercel-queue==0.11.2",
    "python-dotenv>=1.0,<2",
    "pypdf>=6,<7",
    "pypdfium2>=5,<6",
    "reportlab>=4.4.9,<5",
    "rapidocr-onnxruntime>=1.4.4,<2",
    "numpy>=1.24,<3",
    "onnxruntime>=1.20,<2",
    "tiktoken==0.12.0",
    "tokenizers>=0.23,<0.24",
    "winrt-Windows.Foundation>=4!0,<5!0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=4!0,<5!0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=4!0,<5!0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=4!0,<5!0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=4!0,<5!0; sys_platform == 'win32'",
    "python-multipart>=0.0.20,<1",
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.9",
    "sqlite-vec==0.1.9",
    "langchain==1.5.0",
    "langgraph==1.2.22",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langgraph-checkpoint-postgres==3.2.1",
    "psycopg[binary]==3.3.9",
    "langfuse==5.2.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
workspace = []

[tool.vercel]
entrypoint = "backend.hosting:app"

[[tool.vercel.subscribers]]
entrypoint = "backend.workflow.hosted_jobs"

[project.scripts]
claims-workspace = "backend.__main__:main"

[tool.setuptools.packages.find]
include = ["backend*"]
